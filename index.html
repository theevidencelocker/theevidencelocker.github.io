<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Evidence Locker</title>

  <style>
    :root {
      --bg: #f8f9fa;
      --text: #212529;
      --container: #ffffff;
      --header-bg: #3c464f;
      --header-text: #ffffff;
      --border: #dee2e6;
      --hover: #e9ecef;
      --alt: #f8f9fa;
      --input: #ffffff;
      --filter-bg: #e9ecef;
      --link: #0d6efd;
      --icon: #6c757d;
      --tooltip-bg: #333;
      --tooltip-text: #fff;
    }
    [data-theme="dark"] {
      --bg: #121212;
      --text: #e0e0e0;
      --container: #1e1e1e;
      --header-bg: #3c464f;
      --header-text: #ffffff;
      --border: #444;
      --hover: #333;
      --alt: #222;
      --input: #2b2b2b;
      --filter-bg: #2c2c2c;
      --link: #75b6fd;
      --icon: #adb5bd;
      --tooltip-bg: #e0e0e0;
      --tooltip-text: #121212;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      transition: background 0.3s, color 0.3s;
    }
    
    .container {
      max-width: 98%; 
      width: 100%;
      box-sizing: border-box;
      margin: auto;
      background: var(--container);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      min-height: 95vh;
    }

    .header-section { display: flex; flex-direction: column; align-items: center; margin-bottom: 10px; gap: 15px; }
    
    .header-row { 
      display: grid; 
      grid-template-columns: 1fr auto 1fr; 
      align-items: start; 
      width: 100%; 
    }

    #header-logo-img { 
      max-width: 100%; 
      max-height: 250px;
      border-radius: 8px;
    }
    
    .header-logo-wrapper {
      grid-column: 2; 
      justify-self: center; 
      display: flex;
      cursor: pointer;
    }
    
    .header-logo-wrapper:hover {
      opacity: 0.9;
    }

    .header-controls { 
      grid-column: 3; 
      justify-self: end; 
      display: flex; 
      align-items: flex-start;
      gap: 15px; 
      z-index: 10;
    }

    .header-info-stack {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }
    .last-updated-text {
      font-size: 0.75rem;
      color: var(--icon);
      font-weight: 600;
      white-space: nowrap;
    }

    #theme-toggle { 
      background: none; 
      border: 2px solid var(--border); 
      color: var(--text); 
      padding: 6px 10px; 
      border-radius: 20px; 
      cursor: pointer; 
      margin-top: 2px;
    }
    .social-links { display: flex; gap: 15px; justify-content: center; }
    .social-icon { color: var(--text); transition: color 0.2s, transform 0.2s; display: flex; }
    .social-icon:hover { color: var(--link); transform: scale(1.1); }
    
    .tabs-container {
      display: flex;
      justify-content: center;
      gap: 5px;
      width: 100%;
      border-bottom: 3px solid var(--header-bg);
      margin-bottom: 20px;
    }
    .tab-btn {
      padding: 10px 25px;
      background-color: #6c757d;
      color: white;
      text-decoration: none;
      border-radius: 8px 8px 0 0;
      font-family: sans-serif;
      font-weight: bold;
      transition: background-color 0.3s;
    }
    .tab-btn:hover:not(.active) {
      background-color: #07cdda;
    }
    .tab-btn.active {
      background-color: var(--header-bg);
      cursor: default;
    }

    #filter-container {
      display: flex;
      justify-content: center;
    }

    .filters-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); 
      gap: 10px; 
      margin-bottom: 20px; 
      padding: 15px; 
      background: var(--filter-bg); 
      border-radius: 6px; 
      border: 1px solid var(--border);
      width: 100%;
      max-width: 800px;
    }
    .filters-grid label { 
      font-size: 0.9em; 
      font-weight: bold; 
      display: flex; 
      flex-direction: column;
      text-align: center;
    }
    .filters-grid input { 
      margin-top: 5px; 
      padding: 8px; 
      border: 1px solid var(--border); 
      border-radius: 4px; 
      background: var(--input); 
      color: var(--text);
      text-align: center;
    }

    .table-responsive { 
      overflow-x: auto; 
      overflow-y: auto; 
      width: 100%; 
      max-height: 65vh; 
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    
    table { 
      width: 100%; 
      border-collapse: collapse; 
      margin-top: 0; 
      table-layout: auto;
    }
    
    th, td { 
      text-align: center; 
      padding: 12px; 
      border-bottom: 1px solid var(--border); 
      vertical-align: middle;
    }
    
    th {
      background: var(--header-bg);
      color: var(--header-text);
      cursor: pointer;
      position: sticky; 
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 2px -1px rgba(0,0,0,0.4);
      user-select: none;
    }
    th:hover { opacity: 0.9; }
    
    tbody tr:nth-child(even) { background: var(--alt); }
    tr:hover { background: var(--hover); }
    a { color: var(--link); text-decoration: none; }

    .copy-container { position: relative; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
    .copy-tooltip { 
      visibility: hidden; 
      background: var(--tooltip-bg); 
      color: var(--tooltip-text); 
      padding: 6px 10px; 
      border-radius: 4px; 
      position: absolute; 
      bottom: 125%; 
      left: 50%; 
      transform: translateX(-50%); 
      opacity: 0; 
      transition: opacity 0.3s; 
      font-family: monospace; 
      font-size: 0.8rem; 
      pointer-events: none; 
      white-space: nowrap; 
      z-index: 100;
    }
    
    tr:nth-child(-n+3) .copy-tooltip {
      bottom: auto;
      top: 125%;
    }

    .copy-container:hover .copy-tooltip { visibility: visible; opacity: 1; }
    .copy-tooltip.copied { background: #28a745; color: #fff; }

    .footer-section { margin-top: auto; text-align: center; padding-top: 40px; }
    .powered-by { font-size: 0.9rem; font-weight: bold; color: var(--icon); text-transform: uppercase; letter-spacing: 1px; }
    
    #footer-logo-img { 
      max-width: 300px;
      max-height: 120px;
      margin-top: 10px;
      margin-bottom: 10px;
      border-radius: 8px;
    }
    
    @media (max-width: 768px) {
      .header-row {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }
      
      .header-controls {
        position: static;
        grid-column: auto;
        justify-self: auto;
        flex-direction: column;
        align-items: center;
        width: 100%;
        gap: 15px;
      }
      
      .header-logo-wrapper { grid-column: auto; justify-self: auto; }
      .header-info-stack { align-items: center; }
    }
  </style>
</head>

<body>
<div class="container">
  <div class="header-section">
    <div class="header-row">

      <a href="https://theevidencelocker.github.io/" class="header-logo-wrapper">
        <img id="header-logo-img" alt="Header Logo">
      </a>
      
      <div class="header-controls">
        <div class="header-info-stack">
          <div style="display: flex; align-items: center; gap: 20px;">
            <a href="https://forms.gle/P3jnEAP94ai5aFdt5" 
               target="_blank" 
               rel="noopener noreferrer" 
               onmouseover="this.style.backgroundColor='#07cdda'; this.style.borderColor='#07cdda';" 
               onmouseout="this.style.backgroundColor='#6c757d'; this.style.borderColor='#6c757d';"
               style="
                display: inline-block; 
                padding: 8px 16px; 
                background-color: #6c757d; 
                color: white; 
                text-decoration: none; 
                border-radius: 4px; 
                font-family: sans-serif; 
                font-weight: bold;
                border: 1px solid #6c757d; 
                transition: background-color 0.3s, border-color 0.3s;
               ">
               New Submission
            </a>
            
            <div class="social-links" id="header-social-links"></div>
          </div>
          
          <div id="last-updated" class="last-updated-text"></div>
        </div>
        <button id="theme-toggle"><span id="theme-icon">🌓</span></button>
      </div>
    </div>
  </div>

  <div class="tabs-container">
    <a href="https://theevidencelocker.github.io/" class="tab-btn active">Main Compendium</a>
    <a href="file_search.html" class="tab-btn">File Search Engine</a>
  </div>

  <div id="filter-container">
    <div class="filters-grid">
      <label>Global Search:<input type="text" id="search-global" placeholder="Global Search"></label>
      <label>Year:<input type="text" id="filter-year" placeholder="Filter Year"></label>
      <label>Author:<input type="text" id="filter-author" placeholder="Filter Author"></label>
      <label>OS:<input type="text" id="filter-os" placeholder="Filter OS"></label>
      <label>Category:<input type="text" id="filter-category" placeholder="Filter Category"></label>
      <button id="clear-filters" style="grid-column:1/-1;padding:8px;background:#6c757d;color:white;border:none;border-radius:4px;cursor:pointer;">Clear Filters</button>
    </div>
  </div>

  <div class="table-responsive">
    <table id="evidence-table">
      <thead>
        <tr>
          <th data-sort="year">Year <span class="sort-icon"></span></th>
          <th data-sort="author">Author <span class="sort-icon"></span></th>
          <th data-sort="os">OS <span class="sort-icon"></span></th>
          <th data-sort="category">Category <span class="sort-icon"></span></th>
          <th data-sort="evidenceName">Evidence File <span class="sort-icon"></span></th>
          <th>Explore File List</th>
		  <th data-sort="filesize">File Size <span class="sort-icon"></span></th>
          <th>Password</th>
          <th>Hash</th>
          <th data-sort="event">Event <span class="sort-icon"></span></th>
          <th>Info</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <div class="footer-section">
    <div class="powered-by">Powered By</div>
    <img id="footer-logo-img" alt="Footer Logo">
    <div class="social-links" id="footer-social-links"></div>
  </div>
</div>

<script>
  const CONFIG = {
    headerLogo: "theevidencelocker.png",
    footerLogo: "stark4n6.jpg",
    social: {
      website: "https://startme.stark4n6.com/",
      github: "https://github.com/stark4n6",
      linkedin: "https://www.linkedin.com/in/kevin-pagano/",
      x: "https://twitter.com/stark4n6"
    }
  };

  const ICONS = {
    password: `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>`,
    hash: `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>`,
    info: `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>`,
    explore: `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>`
  };

  const SOCIAL = {
    web: `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`,
    git: `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77A5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>`,
    in: `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>`,
    x: `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231z"/></svg>`
  };

  function copyToClipboard(text, tooltipId) {
    navigator.clipboard.writeText(text).then(() => {
      const tip = document.getElementById(tooltipId);
      const old = tip.innerText;
      tip.innerText = "Copied!";
      tip.classList.add("copied");
      setTimeout(() => { tip.innerText = old; tip.classList.remove("copied"); }, 1500);
    });
  }

  let allData = [], availableFiles = new Set(), sortKey=null, sortDir=1;
  async function loadData() {
    try {
      const manifestRes = await fetch(`file_listing/file_list.json?v=${new Date().getTime()}`);
      if (manifestRes.ok) {
        const fileList = await manifestRes.json();
        availableFiles = new Set(fileList);
      }
    } catch (e) {
      console.warn("Could not load file_list.json manifest:", e);
    }

    const res = await fetch(`data.json?v=${new Date().getTime()}`);
    
    const lastModHeader = res.headers.get('Last-Modified');
    if (lastModHeader) {
      const dateObj = new Date(lastModHeader);
      const year = dateObj.getFullYear();
      const month = String(dateObj.getMonth() + 1).padStart(2, '0');
      const day = String(dateObj.getDate()).padStart(2, '0');
      document.getElementById("last-updated").textContent = `Last Updated: ${year}-${month}-${day}`;
    }

    allData = await res.json();
    render(allData);
  }

  function render(data) {
    const tbody = document.getElementById("table-body");
    tbody.innerHTML = data.map((d,i)=>{
      const getCleanBase = (filename) => {
        if (!filename) return "";
        let name = filename.toLowerCase();
        ['.parquet', '.tar.gz', '.tar', '.zip', '.7z', '.gz', '.json'].forEach(ext => {
          if (name.endsWith(ext)) {
            name = name.slice(0, -ext.length);
          }
        });
        const lastDot = name.lastIndexOf('.');
        return lastDot !== -1 ? name.substring(0, lastDot) : name;
      };

      const compendiumBase = getCleanBase(d.evidenceName);

      let isFileAvailable = false;
      for (const manifestFile of availableFiles) {
        if (getCleanBase(manifestFile) === compendiumBase) {
          isFileAvailable = true;
          break;
        }
      }

      return `
      <tr>
        <td>${d.year}</td>
        <td>${d.author}</td>
        <td>${d.os}</td>
        <td>${d.category}</td>
        <td><a href="${d.evidenceUrl}" target="_blank">${d.evidenceName}</a></td>
        <td>${isFileAvailable ? `<a href="file_search.html?evidence=${encodeURIComponent(compendiumBase)}" title="Explore File List">${ICONS.explore}</a>` : `<span style="opacity: 0.3; cursor: not-allowed;" title="File Search not generated yet">${ICONS.explore}</span>`}</td>
		<td>${d.filesize}</td>
        <td>${d.password ? `<div class="copy-container" onclick="copyToClipboard('${d.password}','pw-${i}')">${ICONS.password}<span id="pw-${i}" class="copy-tooltip">${d.password}</span></div>` : ""}</td>
        <td>${d.hash ? `<div class="copy-container" onclick="copyToClipboard('${d.hash}','hash-${i}')">${ICONS.hash}<span id="hash-${i}" class="copy-tooltip">${d.hash}</span></div>` : ""}</td>
        <td>${d.event}</td>
        <td>${d.infoUrl ? `<a href="${d.infoUrl}" target="_blank" title="${d.infoUrl}">${ICONS.info}</a>` : ""}</td>
      </tr>`;
    }).join("");
  }

  function parseSizeToBytes(sizeStr) {
      if (!sizeStr) return 0;
      const str = sizeStr.toString().trim().toUpperCase();
      const match = str.match(/([\d\.]+)\s*([A-Z]*)/);
      if (!match) return 0;

      const val = parseFloat(match[1]);
      const unit = match[2];

      const multiplier = {
          'B': 1, 'KB': 1024, 'MB': 1024 ** 2, 'GB': 1024 ** 3, 'TB': 1024 ** 4,
          'K': 1024, 'M': 1024 ** 2, 'G': 1024 ** 3, 'T': 1024 ** 4,
      };

      return val * (multiplier[unit] || 1);
  }

  function applyFilters() {
    const y=document.getElementById("filter-year").value.trim();
    const a=document.getElementById("filter-author").value.trim().toLowerCase();
    const o=document.getElementById("filter-os").value.trim().toLowerCase();
    const c=document.getElementById("filter-category").value.trim().toLowerCase();
    const s=document.getElementById("search-global").value.trim().toLowerCase();

    let filtered = allData.filter(d =>
      (!y||String(d.year).includes(y))&&(!a||d.author.toLowerCase().includes(a))&&(!o||d.os.toLowerCase().includes(o))&&(!c||d.category.toLowerCase().includes(c))&&(!s||Object.values(d).some(v=>String(v).toLowerCase().includes(s)))
    );

    if(sortKey){
      filtered.sort((a,b) => {
        let valA = a[sortKey];
        let valB = b[sortKey];

        if (sortKey === 'filesize') {
            valA = parseSizeToBytes(valA);
            valB = parseSizeToBytes(valB);
        } else {
            if(typeof valA === 'string') valA = valA.toLowerCase();
            if(typeof valB === 'string') valB = valB.toLowerCase();
        }

        if(valA < valB) return -1 * sortDir;
        if(valA > valB) return 1 * sortDir;
        return 0;
      });
    }
    render(filtered);
  }

  ["search-global","filter-year","filter-author","filter-os","filter-category"].forEach(id=>document.getElementById(id).addEventListener("input",applyFilters));
  
  document.getElementById("clear-filters").addEventListener("click",()=>{
      ["search-global","filter-year","filter-author","filter-os","filter-category"].forEach(id=>document.getElementById(id).value="");
      sortKey = null;
      document.querySelectorAll(".sort-icon").forEach(icon => icon.textContent = "");
      applyFilters();
  });
  
  document.querySelectorAll("th[data-sort]").forEach(th => {
      th.addEventListener("click", () => {
          const key = th.dataset.sort;
          sortDir = (sortKey === key) ? -sortDir : 1;
          sortKey = key;
          
          document.querySelectorAll(".sort-icon").forEach(icon => icon.textContent = "");
          
          const activeIcon = th.querySelector(".sort-icon");
          if (activeIcon) {
              activeIcon.textContent = sortDir === 1 ? " ▲" : " ▼";
          }
          
          applyFilters();
      });
  });
  
  document.getElementById("theme-toggle").addEventListener("click",()=>{const html=document.documentElement;const dark=html.getAttribute("data-theme")==="dark";html.setAttribute("data-theme",dark?"light":"dark");localStorage.setItem("theme",dark?"light":"dark");document.getElementById("theme-icon").textContent=dark?"🌓":"☀️";});

  function setupUI() {
    document.getElementById("header-logo-img").src = CONFIG.headerLogo;
    document.getElementById("footer-logo-img").src = CONFIG.footerLogo;

    const S=CONFIG.social;
    const sHTML=`<a href="${S.website}" target="_blank" class="social-icon">${SOCIAL.web}</a><a href="${S.github}" target="_blank" class="social-icon">${SOCIAL.git}</a><a href="${S.linkedin}" target="_blank" class="social-icon">${SOCIAL.in}</a><a href="${S.x}" target="_blank" class="social-icon">${SOCIAL.x}</a>`;
    document.getElementById("header-social-links").innerHTML=sHTML;
    document.getElementById("footer-social-links").innerHTML=sHTML;

    const html=document.documentElement;
    const themeIcon = document.getElementById("theme-icon");
    const currentTheme = localStorage.getItem("theme") || "dark"; 
    html.setAttribute("data-theme", currentTheme);
    themeIcon.textContent = (currentTheme === "dark") ? "☀️" : "🌓";
  }

  setupUI(); 
  loadData();
</script>
</body>
</html>
